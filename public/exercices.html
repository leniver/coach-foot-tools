<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Exercices d'entraînement</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Styles spécifiques aux exercices */
    .cat-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 0 12px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .cat-link {
      background: var(--border);
      border: 0;
      border-radius: 999px;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin: 0;
      min-height: 0;
      padding: 8px 14px;
      text-decoration: none;
    }
    .cat-link.active { background: var(--primary); color: white; }
    .cat-title {
      scroll-margin-top: 70px;
      margin: 22px 0 10px 0;
    }
    .exo-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .exo-head {
      align-items: baseline;
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .exo-title { font-size: 18px; font-weight: bold; }
    .duree {
      background: var(--primary-soft);
      border-radius: 999px;
      color: var(--primary);
      flex: 0 0 auto;
      font-size: 13px;
      font-weight: bold;
      padding: 4px 10px;
      white-space: nowrap;
    }
    .exo-desc { margin: 8px 0 0 0; }
    .exo-image {
      display: block;
      width: 100%;
      height: auto;
      margin-top: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      cursor: zoom-in;
    }
    .exo-image.hidden { display: none; }
    .link-btn {
      background: none;
      border: 0;
      color: var(--primary);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin: 8px 0 0 0;
      min-height: 0;
      padding: 0;
      text-align: left;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.85);
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      border-radius: 8px;
    }
    .players-row {
      align-items: center;
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .players-row label { font-weight: bold; }
    .players-row input { width: 90px; }
    .session-item {
      align-items: center;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-bottom: 8px;
      padding: 10px 12px;
    }
    .session-item-title { font-weight: bold; }
    .session-item-actions {
      display: flex;
      flex: 0 0 auto;
      gap: 6px;
    }
    .session-item-actions button {
      font-size: 16px;
      margin: 0;
      min-height: 40px;
      padding: 6px 10px;
    }
    .session-total { font-weight: bold; margin: 12px 0 0 0; }
    .session-pause { font-size: 13px; margin: 0 0 8px 0; padding-left: 4px; }
    .exo-add { width: 100%; margin-top: 10px; }

    @media (min-width: 850px) {
      .exo-list { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <a href="index.html" class="page-close" title="Retour à l'accueil" aria-label="Fermer">✕</a>
    <h1>Exercices d'entraînement</h1>

    <nav class="tabs">
      <button class="tab-button active" id="tabExercicesBtn" onclick="showTab('exercices')">Exercices</button>
      <button class="tab-button" id="tabSelectionBtn" onclick="showTab('selection')">Sélectionnés</button>
    </nav>

    <section class="tab-panel active" id="tabExercices">
      <nav class="cat-nav" id="catNav"></nav>
      <div id="exoSections"></div>
    </section>

    <section class="tab-panel" id="tabSelection">
      <div class="card">
        <h2>Sélectionnés</h2>
        <div class="players-row">
          <label for="playerCount">Nombre de joueurs</label>
          <input type="number" id="playerCount" min="1" inputmode="numeric" oninput="setPlayers(this.value)" />
        </div>
        <div class="players-row">
          <label for="pauseInput">Pause entre exercices (min)</label>
          <input type="number" id="pauseInput" min="0" inputmode="numeric" oninput="setPause(this.value)" />
        </div>
        <div id="sessionList"></div>
        <p class="session-total" id="sessionTotal"></p>
      </div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightboxImg" src="" alt="" />
  </div>

  <script>
    // Pour ajouter un exercice, ajoute une entrée ici.
    // L'ordre des catégories suit leur première apparition.
    // "duree" et "image" sont optionnels (image : chemin relatif, ex. images/mon-exo.png).
    // "minutes" sert à l'estimation de temps ; "perPlayer: true" = minutes par joueur.
    const exercices = [
      {
        categorie: 'Passes',
        titre: 'La mouche',
        duree: '5-10 min',
        minutes: 10,
        description: 'Cercle de joueurs, 1 ou 2 au milieu. Conserver le ballon en une ou deux touches. Celui qui perd le ballon va au centre.',
        image: 'images/la-mouche.png'
      },
      {
        categorie: 'Passes',
        titre: 'La machine à laver',
        duree: '2 x 5 min',
        minutes: 10,
        description: 'En cercle, les joueurs se font des passes en suivant le sens du cercle ; le ballon circule sans s’arrêter, comme dans une machine à laver. On peut changer de sens après un moment.',
        image: 'images/la-machine-a-laver.png'
      },
      {
        categorie: 'Conduite de balle',
        titre: 'Slalom 1',
        duree: '1 min / joueur',
        minutes: 1,
        perPlayer: true,
        description: 'Sprint pour récupérer le ballon, slalom autour des 3 cônes, retour en conduite pour déposer le ballon dans le cerceau, puis sprint final jusqu’à la ligne d’arrivée.',
        image: 'images/parcours-slalom.png'
      },
      {
        categorie: 'Conduite de balle',
        titre: 'Carré de dribble',
        duree: '5 min',
        minutes: 5,
        description: 'Chaque joueur a un ballon dans un carré délimité. Conduire librement sans sortir ni se toucher, en variant les surfaces : semelle, intérieur et extérieur du pied.',
        image: 'images/carre-de-dribble.png'
      },
      {
        categorie: 'Dribble',
        titre: 'Un contre un',
        duree: '1 min / joueur',
        minutes: 1,
        perPlayer: true,
        description: 'Un joueur est défenseur, les autres viennent un par un. L’attaquant dribble pour éliminer le défenseur puis tire entre le piquet et le poteau du côté de son choix (gauche ou droite). Il devient ensuite défenseur.',
        image: 'images/1-contre-1.png'
      },
      {
        categorie: 'Passes',
        titre: 'Le sourire',
        duree: '5 min (2 joueurs)',
        minutes: 5,
        description: 'À deux, autour de 3 cônes disposés en V : un joueur fait des allers-retours en forme de sourire pendant que l’autre lui passe le ballon d’un côté puis de l’autre. Le coureur contrôle, revient au cône central et repart de l’autre côté. On échange les rôles régulièrement.',
        image: 'images/le-sourire.png'
      }
    ];

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Regroupe les exercices par catégorie en gardant l'ordre d'apparition.
    const categories = [];
    const byCategory = new Map();
    exercices.forEach(exo => {
      if (!byCategory.has(exo.categorie)) {
        byCategory.set(exo.categorie, []);
        categories.push(exo.categorie);
      }
      byCategory.get(exo.categorie).push(exo);
    });

    const filters = ['all', ...categories];
    let selectedCategory = 'all';

    const SESSION_KEY = 'exercicesSession';
    let session = [];   // titres des exercices, dans l'ordre de la séance
    let players = 12;
    let pause = 2;      // minutes de pause entre chaque exercice

    function showTab(name) {
      document.getElementById('tabExercices').classList.toggle('active', name === 'exercices');
      document.getElementById('tabSelection').classList.toggle('active', name === 'selection');
      document.getElementById('tabExercicesBtn').classList.toggle('active', name === 'exercices');
      document.getElementById('tabSelectionBtn').classList.toggle('active', name === 'selection');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderNav() {
      document.getElementById('catNav').innerHTML = filters.map((cat, index) => {
        const label = cat === 'all' ? 'Toutes' : cat;
        const active = cat === selectedCategory ? ' active' : '';
        return `<button class="cat-link${active}" onclick="selectCategory(${index})">${escapeHtml(label)}</button>`;
      }).join('');
    }

    function renderSections() {
      const shown = selectedCategory === 'all'
        ? categories
        : categories.filter(cat => cat === selectedCategory);
      document.getElementById('exoSections').innerHTML = shown.map(cat => `
        <section>
          <h2 class="cat-title">${escapeHtml(cat)}</h2>
          <div class="exo-list">
            ${byCategory.get(cat).map(exo => {
              const count = session.filter(titre => titre === exo.titre).length;
              const gi = exercices.indexOf(exo);
              return `
              <div class="card">
                <div class="exo-head">
                  <span class="exo-title">${escapeHtml(exo.titre)}</span>
                  ${exo.duree ? `<span class="duree">${escapeHtml(exo.duree)}</span>` : ''}
                </div>
                <p class="exo-desc">${escapeHtml(exo.description)}</p>
                ${exo.image ? `
                  <button class="link-btn" onclick="toggleImage(this)">Voir plus</button>
                  <img class="exo-image hidden" src="${encodeURI(exo.image)}" alt="${escapeHtml(exo.titre)}" loading="lazy" onclick="openLightbox(this.src, this.alt)" />
                ` : ''}
                <button class="exo-add success" onclick="addToSession(${gi})">Ajouter à la séance${count ? ` (${count}×)` : ''}</button>
              </div>`;
            }).join('')}
          </div>
        </section>
      `).join('');
    }

    function selectCategory(index) {
      selectedCategory = filters[index];
      renderNav();
      renderSections();
    }

    function toggleImage(button) {
      const img = button.nextElementSibling;
      if (!img) return;
      const hidden = img.classList.toggle('hidden');
      button.textContent = hidden ? 'Voir plus' : 'Voir moins';
    }

    function openLightbox(src, alt) {
      const box = document.getElementById('lightbox');
      const img = document.getElementById('lightboxImg');
      img.src = src;
      img.alt = alt || '';
      box.classList.add('open');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.getElementById('lightboxImg').src = '';
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closeLightbox();
    });

    // --- Séance (sélection d'exercices, ordre, estimation de temps) ---
    function findExo(titre) {
      return exercices.find(exo => exo.titre === titre);
    }

    function exoMinutes(exo) {
      const base = Number(exo.minutes) || 0;
      return exo.perPlayer ? base * players : base;
    }

    function formatMinutes(total) {
      total = Math.round(total);
      if (total < 60) return `${total} min`;
      const hours = Math.floor(total / 60);
      const mins = total % 60;
      return mins ? `${hours} h ${String(mins).padStart(2, '0')}` : `${hours} h`;
    }

    function addToSession(index) {
      const exo = exercices[index];
      if (!exo) return;
      session.push(exo.titre);
      persistSession();
      renderSections();
      renderSession();
    }

    function moveSession(pos, direction) {
      const target = pos + direction;
      if (target < 0 || target >= session.length) return;
      [session[pos], session[target]] = [session[target], session[pos]];
      persistSession();
      renderSession();
    }

    function removeFromSession(pos) {
      session.splice(pos, 1);
      persistSession();
      renderSections();
      renderSession();
    }

    function setPlayers(value) {
      const n = parseInt(value, 10);
      players = Number.isFinite(n) && n > 0 ? n : 0;
      persistSession();
      renderSession();
    }

    function setPause(value) {
      const n = parseInt(value, 10);
      pause = Number.isFinite(n) && n >= 0 ? n : 0;
      persistSession();
      renderSession();
    }

    function renderSession() {
      const list = document.getElementById('sessionList');
      const totalEl = document.getElementById('sessionTotal');
      document.getElementById('tabSelectionBtn').textContent =
        session.length ? `Sélectionnés (${session.length})` : 'Sélectionnés';

      if (!session.length) {
        list.innerHTML = '<p class="muted">Aucun exercice sélectionné. Ajoute des exercices depuis l’onglet « Exercices ».</p>';
        totalEl.textContent = '';
        return;
      }

      const rows = [];
      session.forEach((titre, pos) => {
        const exo = findExo(titre);
        if (!exo) return;
        const detail = exo.perPlayer ? ` (${exo.minutes} min × ${players} joueurs)` : '';
        rows.push(`
          <div class="session-item">
            <div>
              <div class="session-item-title">${pos + 1}. ${escapeHtml(exo.titre)}</div>
              <div class="muted">${formatMinutes(exoMinutes(exo))}${detail}</div>
            </div>
            <div class="session-item-actions">
              <button onclick="moveSession(${pos}, -1)" ${pos === 0 ? 'disabled' : ''} aria-label="Monter">↑</button>
              <button onclick="moveSession(${pos}, 1)" ${pos === session.length - 1 ? 'disabled' : ''} aria-label="Descendre">↓</button>
              <button class="danger" onclick="removeFromSession(${pos})" aria-label="Retirer">✕</button>
            </div>
          </div>
        `);
        if (pause > 0 && pos < session.length - 1) {
          rows.push(`<div class="session-pause muted">⏸ Pause ${pause} min</div>`);
        }
      });
      list.innerHTML = rows.join('');

      const exoTotal = session.reduce((sum, titre) => {
        const exo = findExo(titre);
        return sum + (exo ? exoMinutes(exo) : 0);
      }, 0);
      const pauseTotal = Math.max(0, session.length - 1) * pause;
      totalEl.textContent = `Temps total estimé : ${formatMinutes(exoTotal + pauseTotal)}`;
    }

    function persistSession() {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ players, pause, session }));
    }

    function restoreSession() {
      try {
        const data = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (!data) return;
        if (Number(data.players) > 0) players = Number(data.players);
        if (Number.isFinite(Number(data.pause)) && Number(data.pause) >= 0) pause = Number(data.pause);
        if (Array.isArray(data.session)) session = data.session.filter(titre => findExo(titre));
      } catch (e) {
        // ignore
      }
    }

    restoreSession();
    document.getElementById('playerCount').value = players;
    document.getElementById('pauseInput').value = pause;
    renderNav();
    renderSections();
    renderSession();
  </script>
</body>
</html>
